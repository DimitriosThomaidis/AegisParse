name: AegisParse Clinical Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  clinical-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Single Source of Truth JSON Configurations
        run: |
          python -m json.tool config_rules.json > /dev/null
          python -m json.tool clinical_lexicons.json > /dev/null
          python -m json.tool seed_ontology.json > /dev/null
          python -m json.tool loinc_metadata.json > /dev/null

      - name: Install Dependencies (CPU-Optimized PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Deterministic Clinical Guardrail & Lexicon Tests
        run: |
          pytest tests/test_clinical_engine.py -v